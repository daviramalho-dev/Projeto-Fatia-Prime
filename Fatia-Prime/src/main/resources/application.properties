spring.application.name=Fatia-Prime

server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=native

spring.datasource.url=jdbc:h2:mem:fatiaprime
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

app.admin.bootstrap-email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap-name=${APP_ADMIN_BOOTSTRAP_NAME:Administrador}

app.frete.loja-lat=-16.045839
app.frete.loja-lng=-48.033231
app.frete.raio-km=30
app.frete.faixas[0].nome=0 a 10 km
app.frete.faixas[0].ate-km=10
app.frete.faixas[0].valor=5.00
app.frete.faixas[1].nome=Acima de 10 ate 20 km
app.frete.faixas[1].ate-km=20
app.frete.faixas[1].valor=8.00
app.frete.faixas[2].nome=Acima de 20 ate 30 km
app.frete.faixas[2].ate-km=30
app.frete.faixas[2].valor=12.00
app.frete.brasil-api-url=https://brasilapi.com.br/api/cep/v2
app.frete.via-cep-url=https://viacep.com.br/ws
app.frete.nominatim-url=https://nominatim.openstreetmap.org/search
app.frete.nominatim-user-agent=FatiaPrime/1.0 (+https://github.com/daviramalho-dev/Projeto-Fatia-Prime)
app.frete.connect-timeout=2s
app.frete.read-timeout=5s