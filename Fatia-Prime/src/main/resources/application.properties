spring.application.name=Fatia-Prime

server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:fatiaprime
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

app.admin.bootstrap-email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap-name=${APP_ADMIN_BOOTSTRAP_NAME:Administrador}